name: Apply validated lazy-contraction patch

on:
  push:
    branches: [sparse-cherry-closure]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sparse-cherry-closure
          fetch-depth: 0
      - name: Apply and publish validated implementation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/scc-parts/part-*)
          if ((${#parts[@]} == 0)); then
            echo "No staged patch parts; nothing to do."
            exit 0
          fi
          cat "${parts[@]}" > /tmp/scc.patch
          echo "f8aac965928ac8b1ae552a77a55d5a0f4bc6ea109eeea1b3a57adc6b26733175  /tmp/scc.patch" | sha256sum -c -
          git apply --check /tmp/scc.patch
          git apply --index /tmp/scc.patch
          git rm -r .github/scc-parts
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git commit -m "Implement lazy sparse-blossom contraction"
          git push origin HEAD:sparse-cherry-closure
