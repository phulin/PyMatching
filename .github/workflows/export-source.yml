name: Export source
on:
  push:
    branches: [sparse-cherry-closure]
  pull_request:
    branches: [master]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/upload-artifact@v4
        with:
          name: pymatching-source
          path: .
          include-hidden-files: true
          retention-days: 1
