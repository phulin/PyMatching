name: Export source
on:
  push:
    branches: [sparse-cherry-closure]
  pull_request:
    branches: [master]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Vendor build dependencies for local/offline build
        run: |
          git clone --depth 1 --branch release-1.12.1 https://github.com/google/googletest.git _vendor/googletest
          git clone https://github.com/quantumlib/Stim.git _vendor/stim
          git -C _vendor/stim checkout 1320ad7eac7de34d2e9c70daa44fbc6d84174450
          rm -rf _vendor/googletest/.git _vendor/stim/.git
      - uses: actions/upload-artifact@v4
        with:
          name: pymatching-source
          path: .
          include-hidden-files: true
          retention-days: 1
