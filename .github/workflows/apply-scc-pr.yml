name: Publish validated lazy-contraction implementation

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'sparse-cherry-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sparse-cherry-closure
          fetch-depth: 0
      - name: Verify, apply, and publish
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/scc-parts/part-*)
          test ${#parts[@]} -eq 8
          cat "${parts[@]}" > /tmp/scc.patch
          echo "f8aac965928ac8b1ae552a77a55d5a0f4bc6ea109eeea1b3a57adc6b26733175  /tmp/scc.patch" | sha256sum -c -
          git apply --check /tmp/scc.patch
          git apply --index /tmp/scc.patch
          git rm -r .github/scc-parts
          git rm .github/workflows/apply-scc-pr.yml .github/workflows/export-source.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git commit -m "Implement lazy sparse-blossom contraction"
          git push origin HEAD:sparse-cherry-closure
