name: erasure-one-solve-smoke

on:
  push:
    branches: [erasure-e2e-bench]
    paths:
      - '.github/workflows/erasure-one-solve-smoke.yml'
      - 'dev/apply_edges_observables_weight_patch.py'

concurrency:
  group: erasure-one-solve-smoke
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Publish run id
        run: |
          out="benchmark-output/one-solve-start/$GITHUB_SHA"
          mkdir -p "$out"
          printf '{"run_id": %s, "commit": "%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$out/run.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out/run.json"
          git commit -m "Record one-solve smoke run id for $GITHUB_SHA"
          git pull --rebase origin erasure-e2e-bench
          git push origin HEAD:erasure-e2e-bench
      - name: Build and test
        run: |
          set -o pipefail
          : > one-solve.log
          {
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel cmake ninja pybind11 pytest
            python dev/apply_edges_observables_weight_patch.py
            python -m pip install -v .
            python - <<'PY'
            import numpy as np
            import pymatching
            import stim

            circuit = stim.Circuit.generated(
                'surface_code:rotated_memory_x',
                distance=3,
                rounds=3,
                after_clifford_depolarization=0.01,
            )
            matcher = pymatching.Matching.from_detector_error_model(
                circuit.detector_error_model(decompose_errors=True)
            )
            shots = circuit.compile_detector_sampler().sample(200)
            syndrome = next(s for s in shots if np.any(s))
            edge_info = matcher.edges()[0]
            u, v, data = edge_info
            v_wire = -1 if v is None else v
            new_weight = max(0.0, float(data['weight']) * 0.75)
            reweights = np.array([[u, v_wire, new_weight]], dtype=np.float64)

            expected_obs, expected_weight = matcher.decode(
                syndrome, edge_reweights=reweights, return_weight=True
            )
            expected_edges = matcher.decode_to_edges_array(
                syndrome, edge_reweights=reweights
            )
            edges, obs, weight = matcher.decode_to_edges_array_with_observables_and_weight(
                syndrome, edge_reweights=reweights
            )

            def norm(a):
                return sorted(tuple(sorted(int(x) for x in row if int(x) != -1)) for row in a)

            np.testing.assert_array_equal(obs, expected_obs)
            np.testing.assert_allclose(weight, expected_weight, rtol=0, atol=1e-12)
            assert norm(edges) == norm(expected_edges), (edges, expected_edges)
            print('one-solve API matches decode + decode_to_edges_array')
            print({'num_edges': len(edges), 'weight': float(weight), 'observables': obs.tolist()})
            PY
          } 2>&1 | tee one-solve.log
      - name: Commit output
        if: always()
        run: |
          out="benchmark-output/one-solve/$GITHUB_SHA"
          mkdir -p "$out"
          cp one-solve.log "$out/log.txt" || true
          printf '{"completed": true, "commit": "%s"}\n' "$GITHUB_SHA" > "$out/status.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out"
          git commit -m "Record one-solve smoke output for $GITHUB_SHA" || exit 0
          git pull --rebase origin erasure-e2e-bench
          git push origin HEAD:erasure-e2e-bench
